<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reset password • DAXORA MC</title><style>body{background:#030303;color:#cbbcb5;font:15px Arial;display:grid;place-items:center;min-height:90vh}main{background:#090706;border:1px solid #39261e;border-radius:14px;padding:32px;max-width:380px;width:80%}input,button{box-sizing:border-box;width:100%;padding:14px;margin-top:15px;border-radius:7px;border:1px solid #463025;background:#110b08;color:#d6b29c}button{cursor:pointer}p{font-size:13px;line-height:1.7}a{color:#c4977c}</style></head><body><main><p>DAXORA MC STORE</p><h1>New password</h1><p id="message" role="status">Open the password reset link sent to your email in the same browser you used to request it.</p><form id="reset"><input type="password" id="password" minlength="8" required placeholder="New password (8+ characters)" autocomplete="new-password"><button id="save" disabled>Update password</button></form><p><a href="index.html">Back to store</a></p></main><script src="auth-config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.8/dist/umd/supabase.js"></script><script>const cfg=window.DAXORA_AUTH||{};let client,ready=false;const message=document.getElementById('message'),button=document.getElementById('save');if(cfg.url&&cfg.publishableKey&&window.supabase){client=supabase.createClient(cfg.url,cfg.publishableKey,{auth:{flowType:'pkce',detectSessionInUrl:true}});client.auth.onAuthStateChange((event)=>{if(event==='PASSWORD_RECOVERY'){ready=true;button.disabled=false;message.textContent='Choose a new password for your account.'}})}else message.textContent='Authentication setup is not yet complete.';document.getElementById('reset').addEventListener('submit',async e=>{e.preventDefault();if(!ready)return;button.disabled=true;try{const {error}=await client.auth.updateUser({password:document.getElementById('password').value});if(error)throw error;document.getElementById('password').value='';message.textContent='Password updated. You can return to the store.';ready=false;await client.auth.signOut()}catch(error){message.textContent=error.message;button.disabled=false}});</script></body></html>
